<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" />
  <rect width="188" height="188" x="2" y="2" rx="38" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Solar Sun Core -->
  <circle cx="96" cy="96" r="36" fill="url(#sunGrad)" />
  <circle cx="96" cy="96" r="28" fill="#F59E0B" opacity="0.4" />
  
  <!-- AI Neural Nodes / Rays -->
  <g stroke="url(#sunGrad)" stroke-width="5" stroke-linecap="round">
    <line x1="96" y1="28" x2="96" y2="44" />
    <line x1="96" y1="148" x2="96" y2="164" />
    <line x1="28" y1="96" x2="44" y2="96" />
    <line x1="148" y1="96" x2="164" y2="96" />
    <line x1="48" y1="48" x2="60" y2="60" />
    <line x1="132" y1="132" x2="144" y2="144" />
    <line x1="144" y1="48" x2="132" y2="60" />
    <line x1="48" y1="144" x2="60" y2="132" />
  </g>

  <!-- PV Grid Overlay -->
  <path d="M78 82 H114 M78 96 H114 M78 110 H114 M86 76 V116 M106 76 V116" stroke="#0B0F19" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  
  <!-- AI Sparkle Indicator -->
  <polygon points="138,44 142,54 152,58 142,62 138,72 134,62 124,58 134,54" fill="url(#rayGrad)" />
</svg>
